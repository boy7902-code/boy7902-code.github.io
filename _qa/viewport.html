<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>QA viewport</title>
<style>
  html, body { margin: 0; padding: 0; background: #222; }
  #wrap { display: inline-block; transform-origin: 0 0; }
  iframe { border: 0; display: block; background: #fff; }
</style>
</head>
<body>
<div id="wrap"><iframe id="f"></iframe></div>
<script>
  const q = new URLSearchParams(location.search);
  const w = parseInt(q.get('w') || '390', 10);
  const h = parseInt(q.get('h') || '844', 10);
  const scale = parseFloat(q.get('scale') || '1');
  const f = document.getElementById('f');
  f.width = w; f.height = h;
  f.style.width = w + 'px'; f.style.height = h + 'px';
  document.getElementById('wrap').style.transform = 'scale(' + scale + ')';
  f.src = '../index.html?qa=' + Date.now();
</script>
</body>
</html>
