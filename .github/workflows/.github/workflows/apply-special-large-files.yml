name: Apply special mission large files
on:
  push:
    branches: [special-mission-20261126]
permissions:
  contents: write
concurrency:
  group: special-mission-large-files
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: special-mission-20261126
      - name: Decode and verify large generated sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          pairs = {
            'app.js': ('.github/special-payloads/app.js.gz.b64', '5420c17ac69b352060e88f91739f751d89b9376a7db6c3685c48fddd98e91f90'),
            'app-dex-integrated.js': ('.github/special-payloads/app-dex-integrated.js.gz.b64', '12d14d407d1da6939897feee277176082a05976a1844d1804ba58ffdd65ce178'),
          }
          for target, (payload, expected) in pairs.items():
              payload_path = Path(payload)
              if not payload_path.exists():
                  print(f'{payload} absent; leaving {target} unchanged')
                  continue
              data = gzip.decompress(base64.b64decode(payload_path.read_bytes()))
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{target} sha256 mismatch: {actual}')
              Path(target).write_bytes(data)
              print(f'{target}: verified {len(data)} bytes')
          PY
      - name: Commit verified files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js app-dex-integrated.js
          if ! git diff --cached --quiet; then
            git commit -m 'Add special mission app sources'
            git push origin HEAD:special-mission-20261126
          else
            echo 'Large files already match verified sources'
          fi
