name: tmp-evolution-backgrounds
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'Add temporary evolution backgrounds workflow' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified patch
        run: |
          curl -sL 'https://drive.google.com/uc?export=download&id=1tVOEh4F_Y_pJTmxxsOPxUbSwjVYA6xpl' -o /tmp/evolution.patch
          wc -c /tmp/evolution.patch
          echo '425fa1a2377d134da0c4853ddb54b21253a171c6dce3e6fbeadef92734a38eca  /tmp/evolution.patch' | sha256sum -c -
      - name: Apply patch onto base
        run: |
          git config user.name 'Instinct'
          git config user.email 'instinct@localhost'
          git checkout a7d2fa4bd5a0faf794c47f80aa30e00828740b1c
          git am --3way /tmp/evolution.patch
      - name: Verify patched tree
        run: |
          npm run check
          npm run test:unit
      - name: Push evolution branch
        run: |
          git switch -c evolution-backgrounds-20261126
          git push origin evolution-backgrounds-20261126
