name: tmp-special-mission-feedback-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'Add temporary special fix workflow' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}
          fetch-depth: 0
      - name: Apply verified feedback patch
        run: |
          python3 - <<'PYPATCH'
          from pathlib import Path
          import base64
          Path('special-missions.css').write_bytes(base64.b64decode(''))
          Path('tools/special-missions-ui.test.mjs').write_bytes(base64.b64decode(''))
          p = Path('index.html')
          s = p.read_text()
          assert s.count('special-mission-20261126-1') == 6
          p.write_text(s.replace('special-mission-20261126-1', 'special-mission-20261126-2'))
          p = Path('app.js')
          s = p.read_text()
          old = """      await specialMissionWait(reduced ? 80 : 3350);
      spinning = false;
      hub.textContent = points;"""
          new = """      await specialMissionWait(reduced ? 80 : 3350);
      spinning = false;
      spinBtn.textContent = '돌림판 완료';
      hub.textContent = points;"""
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          p = Path('app-dex-integrated.js')
          s = p.read_text()
          old = 'await specialMissionWait(reduced?80:3350);spinning=false;hub.textContent=points;'
          new = 'await specialMissionWait(reduced?80:3350);spinning=false;spinBtn.textContent="돌림판 완료";hub.textContent=points;'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PYPATCH
      - name: Verify patched tree
        run: |
          npm run check
          npm run test:unit
      - name: Commit and push fix branch
        run: |
          git config user.name 'Instinct'
          git config user.email 'instinct@localhost'
          git switch -c special-mission-feedback-20261126
          git add app.js app-dex-integrated.js index.html special-missions.css tools/special-missions-ui.test.mjs
          git commit -m 'Fix special mission feedback polish'
          git push origin special-mission-feedback-20261126
